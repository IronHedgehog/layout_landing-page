<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Landing Page</title>
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <script
      src="src/scripts/main.js"
      defer
    ></script>
  </head>
  <body class="page__body">
    <header class="header">
      <div class="header__top">
        <a
          class="header__logo-link"
          href="#"
        >
          <img
            class="header__logo-img"
            src="./src/img/logo.png"
            alt="mat logo"
          />
        </a>

        <nav class="header__nav">
          <ul class="header__list">
            <li class="header__item">
              <a
                href="#"
                class="icon icon--phone"
              ></a>
            </li>
            <li class="header__item">
              <a
                href="#menu"
                class="icon icon--menu"
              ></a>
            </li>
          </ul>
        </nav>
      </div>
      <div class="header__center">
        <h1 class="header__title">Welcome to The MET</h1>
      </div>
    </header>
    <aside
      class="page-menu menu"
      id="menu"
    >
      <div class="menu-content">
        <div class="menu__top">
          <a
            class="header__logo-link"
            href="#"
          >
            <img
              class="header__logo-img"
              src="./src/img/logo.png"
              alt="mat logo"
            />
          </a>

          <a
            href="#"
            class="icon icon--close"
          ></a>
        </div>
        <nav class="menu__nav">
          <ul class="menu__list">
            <li class="menu__item">
              <a
                href="#home"
                class="menu__link"
              >
                Home
              </a>
            </li>
            <li class="menu__item">
              <a
                href="#about-us"
                class="menu__link"
              >
                About Us
              </a>
            </li>
            <li class="menu__item">
              <a
                href="#now-on-view"
                class="menu__link"
              >
                Now on view
              </a>
            </li>
            <li class="menu__item">
              <a
                href="#explore-online"
                class="menu__link"
              >
                Explore Online
              </a>
            </li>
            <li class="menu__item">
              <a
                href="#contacts"
                class="menu__link"
              >
                Contacts
              </a>
            </li>
          </ul>
        </nav>

        <ul class="menu__contacts">
          <li class="menu__contact">
            <p class="menu__contact-description">The Met Fifth Avenue</p>
            <a
              href="tel:12125357710"
              class="menu__contact-link"
            >
              +1 212-535-7710
            </a>
          </li>
          <li class="menu__contact">
            <p class="menu__contact-description">The Met Cloisters</p>
            <a
              href="tel:12129233700"
              class="menu__contact-link"
            >
              +1 212-923-3700
            </a>
          </li>
        </ul>

        <button class="menu__button">call to order</button>
      </div>
    </aside>
    <main class="main"></main>
    <footer class="footer"></footer>
  </body>
</html>
