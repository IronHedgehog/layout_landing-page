<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Landing Page</title>
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <script
      src="src/scripts/main.js"
      defer
    ></script>
  </head>
  <body>
    <header class="header">
      <div class="header__top">
        <a
          class="header__logo-link"
          href="#"
        >
          <img
            class="header__logo-img"
            src="./src/img/logo.png"
            alt="mat logo"
          />
        </a>

        <nav class="header__nav">
          <ul class="header__list">
            <li class="header__item">
              <a
                href="#"
                class="header__icon-link"
              >
                <img
                  src="./src/img/icon-phone.png"
                  alt="phone icon"
                />
              </a>
            </li>
            <li class="header__item">
              <a
                href="#"
                class="header__icon-link"
              >
                <img
                  src="./src/img/icon-burger-menu.png"
                  alt="menu icon"
                />
              </a>
            </li>
          </ul>
        </nav>
      </div>
      <div class="header__center"></div>
    </header>
    <main class="main"></main>
    <footer class="footer"></footer>
  </body>
</html>
